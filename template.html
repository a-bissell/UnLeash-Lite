<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN SYSTEM — extracted from UniRoam C2
   Drop-in dark ops dashboard shell. Replace {{PLACEHOLDER}} values.
   Themes: default (dark), [data-theme="light"]
   ═══════════════════════════════════════════════════════════════ */

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-base:#0d0e12;
  --bg-surface:#14151b;
  --bg-elevated:#1c1d25;
  --bg-input:#0a0b0f;
  --bg-video:#050507;
  --text-pri:#e8e9ec;
  --text-body:#c8cad0;
  --text-muted:#6b6f7b;
  --text-dim:#3d404a;
  --border:#2a2d38;
  --border-sub:#1f2128;
  --accent:#d4843e;         /* amber — change to brand colour */
  --accent-dim:rgba(212,132,62,0.15);
  --red:#cc4444;
  --red-dim:rgba(204,68,68,0.15);
  --green:#44aa99;
  --green-dim:rgba(68,170,153,0.15);
  --blue:#5b8bd4;
  --blue-dim:rgba(91,139,212,0.15);
  --modal-bg:rgba(0,0,0,0.6);
  --scrollbar-thumb:var(--border);
}

[data-theme="light"]{
  --bg-base:#f5f6f8;
  --bg-surface:#ffffff;
  --bg-elevated:#ebedf0;
  --bg-input:#f0f1f4;
  --bg-video:#1a1a1a;
  --text-pri:#1a1d23;
  --text-body:#3b3f4a;
  --text-muted:#6b7280;
  --text-dim:#9ca3af;
  --border:#d1d5db;
  --border-sub:#e5e7eb;
  --accent:#b35a1f;
  --accent-dim:rgba(179,90,31,0.1);
  --red:#cc2222;
  --red-dim:rgba(204,34,34,0.08);
  --green:#1a7f37;
  --green-dim:rgba(26,127,55,0.08);
  --blue:#0969da;
  --blue-dim:rgba(9,105,218,0.08);
  --modal-bg:rgba(0,0,0,0.3);
  --scrollbar-thumb:var(--border);
}

body{
  font-family:'SF Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;
  background:var(--bg-base);
  color:var(--text-body);
  font-size:13px;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── Scrollbars ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:48px;
  background:var(--bg-surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo{font-size:14px;font-weight:600;color:var(--text-pri);letter-spacing:2px}
.logo span{color:var(--accent)}   /* coloured second word e.g. APP <span>NAME</span> */
.top-r{display:flex;align-items:center;gap:16px}
.top-actions{display:flex;gap:8px}

/* ── Status indicators ── */
.indicators{display:flex;gap:16px;font-size:12px}
.ind{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-a{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dot-r{background:var(--red);box-shadow:0 0 6px var(--red)}
[data-theme="light"] .dot-g,
[data-theme="light"] .dot-a,
[data-theme="light"] .dot-r{box-shadow:none}

/* ── Buttons ── */
.btn{
  padding:6px 14px;border-radius:4px;font-size:11px;font-family:inherit;
  cursor:pointer;border:1px solid;letter-spacing:0.5px;
  text-transform:uppercase;transition:opacity 0.15s;font-weight:500;
}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-accent{background:var(--accent-dim);color:var(--accent);border-color:rgba(212,132,62,0.3)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(204,68,68,0.3)}
.btn-primary{background:var(--accent);color:var(--bg-base);border-color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border)}
.btn-green{background:var(--green-dim);color:var(--green);border-color:rgba(68,170,153,0.3)}
[data-theme="light"] .btn-primary{color:#fff}
[data-theme="light"] .btn-accent{background:rgba(179,90,31,0.08)}
[data-theme="light"] .btn-danger{background:rgba(204,34,34,0.06)}
[data-theme="light"] .btn-green{background:rgba(26,127,55,0.06)}

/* ── Tabs ── */
.tabs{
  display:flex;border-bottom:1px solid var(--border);
  background:var(--bg-surface);flex-shrink:0;
}
.tab{
  padding:10px 24px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;
  transition:color 0.15s,border-color 0.15s;
}
.tab:hover{color:var(--text-body)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-pane.active{display:flex}

/* ── Stat strip ── */
.stats{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;padding:12px 20px;border-right:1px solid var(--border);background:var(--bg-surface)}
.stat:last-child{border-right:none}
.stat-v{font-size:20px;font-weight:600;color:var(--text-pri)}
.stat-v.hl{color:var(--accent)}
.stat-l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

/* ── Two-column main layout ── */
.main{flex:1;display:grid;grid-template-columns:1fr 300px;overflow:hidden}

/* ── Panel header (reusable) ── */
.panel-head{
  padding:10px 20px;font-size:10px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1.5px;
  border-bottom:1px solid var(--border);background:var(--bg-surface);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}

/* ── Feed / event log ── */
.feed-panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.feed{flex:1;overflow-y:auto;padding:4px 0;background:var(--bg-base)}
.entry{
  display:grid;grid-template-columns:72px 88px 1fr;gap:8px;
  padding:5px 20px;align-items:start;font-size:12px;transition:background 0.15s;
}
.entry:hover{background:var(--bg-elevated)}
.entry-time{color:var(--text-dim);font-size:11px;padding-top:2px}

/* Badge colours — add more as needed */
.badge{
  font-size:10px;font-weight:600;letter-spacing:0.5px;
  padding:2px 8px;border-radius:3px;text-align:center;white-space:nowrap;
}
.b-system{background:rgba(61,64,74,0.3);color:var(--text-muted)}
.b-warning,.b-stage{background:var(--accent-dim);color:var(--accent)}
.b-error,.b-fail{background:var(--red-dim);color:var(--red)}
.b-success,.b-active{background:var(--green-dim);color:var(--green)}
.b-task{background:var(--blue-dim);color:var(--blue)}

/* Expandable detail block inside a feed entry */
.entry-detail{
  grid-column:3;margin-top:4px;padding:8px 12px;
  background:var(--bg-input);border:1px solid var(--border-sub);border-radius:4px;
  font-size:11px;color:var(--text-muted);white-space:pre-wrap;word-break:break-all;
  max-height:200px;overflow-y:auto;display:none;
}
.entry-detail.open{display:block}
.entry-toggle{cursor:pointer;text-decoration:underline;text-underline-offset:2px;opacity:0.7}
.entry-toggle:hover{opacity:1}

@keyframes entry-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.entry-new{animation:entry-in 0.25s ease-out}

/* ── Sidebar (right column) ── */
.sidebar{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-surface)}
.item-list{flex:1;overflow-y:auto}
.item{
  padding:10px 16px;border-bottom:1px solid var(--border-sub);
  display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:background 0.15s;
}
.item:hover{background:var(--bg-elevated)}
.item.selected{background:var(--bg-elevated);border-left:2px solid var(--accent)}
.item-badge{
  width:22px;height:22px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;flex-shrink:0;
}
.ib-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(204,68,68,0.3)}
.ib-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(68,170,153,0.3)}
.ib-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(91,139,212,0.3)}
.item-info{flex:1;min-width:0}
.item-title{font-size:12px;font-weight:500;color:var(--text-pri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:10px;color:var(--text-muted)}
.item-status{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:500}
.is-active{background:var(--green-dim);color:var(--green)}
.is-stale{background:rgba(61,64,74,0.3);color:var(--text-muted)}
[data-theme="light"] .is-stale,[data-theme="light"] .b-system{background:rgba(107,114,128,0.1)}

/* ── Command / action panel (bottom of sidebar) ── */
.cmd-panel{border-top:1px solid var(--border);padding:12px 16px;flex-shrink:0}
.cmd-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.cmd-row{display:flex;gap:6px;margin-bottom:6px}
.cmd-row:last-child{margin-bottom:0}
.cmd-sel{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text-body);
  padding:6px 8px;border-radius:4px;font-size:11px;font-family:inherit;flex:1;
  appearance:none;-webkit-appearance:none;
}
.cmd-input{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text-pri);
  padding:6px 10px;border-radius:4px;font-size:12px;font-family:inherit;flex:1;
}
.cmd-input::placeholder{color:var(--text-dim)}
.cmd-input:focus,.cmd-sel:focus{outline:none;border-color:var(--accent)}

/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;background:var(--modal-bg);z-index:200;backdrop-filter:blur(2px)}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;
  width:560px;max-width:calc(100vw - 32px);
  background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;
  display:flex;flex-direction:column;max-height:80vh;overflow:hidden;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-head h3{font-size:13px;font-weight:600;color:var(--text-pri);letter-spacing:1px;text-transform:uppercase}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--text-pri)}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}

/* ── Login overlay ── */
.login-overlay{
  position:fixed;inset:0;background:var(--bg-base);
  display:flex;align-items:center;justify-content:center;
  z-index:100;flex-direction:column;gap:16px;
}
.login-box{display:flex;flex-direction:column;gap:12px;align-items:center}
.login-box .logo{font-size:18px;margin-bottom:8px}
.login-row{display:flex;gap:8px}
.login-input{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text-pri);
  padding:10px 16px;border-radius:4px;font-size:13px;font-family:inherit;width:250px;
}
.login-input:focus{outline:none;border-color:var(--accent)}
.login-input::placeholder{color:var(--text-dim)}
.login-err{color:var(--red);font-size:12px;display:none}

/* ── Empty state ── */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text-dim);font-size:12px;gap:4px;
}

/* ── Bottom status bar ── */
.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:28px;
  background:var(--bg-surface);border-top:1px solid var(--border);
  font-size:11px;color:var(--text-muted);flex-shrink:0;
}
.live-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);box-shadow:0 0 4px var(--green);
  margin-right:6px;animation:pulse 2s infinite;
}
[data-theme="light"] .live-dot{box-shadow:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── Spinner ── */
.spinner{
  width:14px;height:14px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;display:none;
}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Theme toggle button ── */
.btn-theme{background:transparent;color:var(--text-muted);border-color:var(--border);font-size:13px;padding:4px 10px;line-height:1}
</style>
</head>
<body>

<!-- ═══════════════════ LOGIN OVERLAY ═══════════════════
     Show on load if no token. Hide after auth.          -->
<div class="login-overlay" id="login-overlay" style="display:none">
  <div class="login-box">
    <div class="logo">APP <span>NAME</span></div>
    <div class="login-row">
      <input type="password" class="login-input" id="login-pw" placeholder="Password" autofocus>
      <button class="btn btn-primary" onclick="doLogin()">ACCESS</button>
    </div>
    <div class="login-err" id="login-err">Invalid password</div>
  </div>
</div>

<!-- ═══════════════════ MODAL EXAMPLE ═══════════════════
     Toggle display:none / display:flex via JS           -->
<div id="modal-backdrop" class="modal-backdrop" style="display:none" onclick="closeModal()"></div>
<div id="modal" class="modal" style="display:none">
  <div class="modal-head">
    <h3>Modal Title</h3>
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
  </div>
  <div class="modal-body">
    <!-- modal content here -->
  </div>
</div>

<!-- ═══════════════════ TOP BAR ═══════════════════ -->
<div class="topbar">
  <div class="logo">APP <span>NAME</span></div>
  <div class="top-r">
    <div class="indicators">
      <div class="ind"><div class="dot dot-g"></div><span id="ind-status">Online</span></div>
      <div class="ind"><div class="dot dot-a" id="ind-dot"></div><span id="ind-count">0 active</span></div>
    </div>
    <div class="top-actions">
      <button class="btn btn-theme" id="btn-theme" onclick="toggleTheme()" title="Toggle light/dark">&#x263C;</button>
      <button class="btn btn-accent" onclick="openModal()">ACTION</button>
      <button class="btn btn-danger" onclick="dangerAction()">DANGER</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ TABS ═══════════════════ -->
<div class="tabs">
  <div class="tab active" id="tab-main"   onclick="switchTab('main')">Main</div>
  <div class="tab"        id="tab-detail" onclick="switchTab('detail')">Detail</div>
  <div class="tab"        id="tab-intel"  onclick="switchTab('intel')">Intel</div>
</div>

<!-- ═══════════════════ MAIN TAB ═══════════════════ -->
<div class="tab-pane active" id="pane-main">

  <!-- Stat strip — add/remove .stat blocks freely -->
  <div class="stats">
    <div class="stat"><div class="stat-v hl" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v"    id="s-active">0</div><div class="stat-l">Active</div></div>
    <div class="stat"><div class="stat-v"    id="s-tasks">0</div> <div class="stat-l">Tasks</div></div>
    <div class="stat"><div class="stat-v"    id="s-done">0</div>  <div class="stat-l">Done</div></div>
  </div>

  <!-- Two-column: feed (left) + sidebar (right) -->
  <div class="main">

    <!-- Live event feed -->
    <div class="feed-panel">
      <div class="panel-head">
        <span>Live feed</span>
        <button class="btn btn-ghost" style="padding:2px 8px;font-size:10px" onclick="clearFeed()">Clear</button>
      </div>
      <div class="feed" id="feed"></div>
    </div>

    <!-- Sidebar: item list + command panel -->
    <div class="sidebar">
      <div class="panel-head"><span>Items</span></div>
      <div class="item-list" id="item-list">
        <div class="empty">Nothing here yet</div>
      </div>

      <div class="cmd-panel">
        <div class="cmd-label">Command</div>
        <div class="cmd-row">
          <select class="cmd-sel" id="cmd-target"><option value="*">All items</option></select>
          <select class="cmd-sel" id="cmd-type">
            <option value="ACTION_A">Action A</option>
            <option value="ACTION_B">Action B</option>
          </select>
        </div>
        <div class="cmd-row">
          <input class="cmd-input" id="cmd-input" placeholder="$ parameter..."
                 onkeydown="if(event.key==='Enter')sendCommand()">
          <button class="btn btn-primary" style="padding:6px 16px" onclick="sendCommand()">SEND</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════════ DETAIL TAB ═══════════════════ -->
<div class="tab-pane" id="pane-detail">
  <div class="empty">Detail pane — replace with your content</div>
</div>

<!-- ═══════════════════ INTEL TAB ═══════════════════ -->
<div class="tab-pane" id="pane-intel">
  <div class="empty">Intel pane — replace with your content</div>
</div>

<!-- ═══════════════════ BOTTOM BAR ═══════════════════ -->
<div class="bottombar">
  <span><span class="live-dot"></span>Live &middot; polling 3s</span>
  <span id="bottom-info">Connecting&hellip;</span>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   SHELL JS — minimal wiring. Replace API_BASE and add your calls.
   ═══════════════════════════════════════════════════════════════ */

var API = window.location.origin;
var token = localStorage.getItem('app_token');
var autoScroll = true;
var entryN = 0;

/* ── Theme ── */
(function(){
  var saved = localStorage.getItem('app_theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  if (cur === 'light'){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('app_theme', 'dark');
    document.getElementById('btn-theme').innerHTML = '&#x263C;';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('app_theme', 'light');
    document.getElementById('btn-theme').innerHTML = '&#x263E;';
  }
}
if (localStorage.getItem('app_theme') === 'light'){
  var _bt = document.getElementById('btn-theme');
  if (_bt) _bt.innerHTML = '&#x263E;';
}

/* ── Auth ── */
document.getElementById('login-pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') doLogin();
});
if (token){ init(); }
else { document.getElementById('login-overlay').style.display = 'flex'; }

function doLogin(){
  var pw = document.getElementById('login-pw').value;
  // Replace with your auth endpoint:
  fetch(API + '/api/login?password=' + encodeURIComponent(pw))
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(d){
      token = d.token;
      localStorage.setItem('app_token', token);
      document.getElementById('login-overlay').style.display = 'none';
      init();
    })
    .catch(function(){ document.getElementById('login-err').style.display = 'block'; });
}

function aH(){ return {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}; }
function aFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign(aH(), opts.headers || {});
  return fetch(url, opts).then(function(r){
    if (r.status === 401){
      token = null;
      localStorage.removeItem('app_token');
      document.getElementById('login-overlay').style.display = 'flex';
      throw new Error('auth');
    }
    return r;
  });
}

/* ── Init ── */
function init(){
  document.getElementById('login-overlay').style.display = 'none';
  addEntry('system', 'SYSTEM', 'Console connected');
  loadAll();
  setInterval(loadAll, 3000);
  var feed = document.getElementById('feed');
  feed.addEventListener('scroll', function(){
    autoScroll = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  });
}

/* ── Data loading — replace these with your API calls ── */
function loadAll(){
  // Example: aFetch(API + '/api/stats').then(r => r.json()).then(updateStats);
  document.getElementById('bottom-info').textContent = window.location.host;
}

/* ── Feed helpers ── */
function addEntry(type, label, message, detail){
  var id = 'e' + (entryN++);
  var now = new Date();
  var time = now.toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
  var feed = document.getElementById('feed');
  var el = document.createElement('div');
  el.className = 'entry entry-new';
  var html = '<div class="entry-time">' + time + '</div>'
           + '<div class="badge b-' + type + '">' + label + '</div><div>';
  if (detail){
    var did = 'd' + id;
    html += '<span class="entry-toggle" onclick="toggleDetail(\'' + did + '\')">' + esc(message) + '</span>'
          + '<div class="entry-detail" id="' + did + '">' + esc(detail) + '</div>';
  } else {
    html += esc(message);
  }
  html += '</div>';
  el.innerHTML = html;
  feed.appendChild(el);
  if (autoScroll) feed.scrollTop = feed.scrollHeight;
}
function toggleDetail(id){ document.getElementById(id).classList.toggle('open'); }
function clearFeed(){ document.getElementById('feed').innerHTML = ''; addEntry('system', 'SYSTEM', 'Feed cleared'); }
function esc(s){
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function timeSince(iso){
  if (!iso) return '';
  var d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60)    return Math.floor(d) + 's ago';
  if (d < 3600)  return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}

/* ── Tab switching ── */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('pane-' + name).classList.add('active');
}

/* ── Modal ── */
function openModal(){
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modal-backdrop').style.display = 'none';
  document.getElementById('modal').style.display = 'none';
}

/* ── Command panel ── */
function sendCommand(){
  var target = document.getElementById('cmd-target').value;
  var type   = document.getElementById('cmd-type').value;
  var param  = document.getElementById('cmd-input').value;
  addEntry('task', 'CMD', type + ' → ' + (target === '*' ? 'ALL' : target) + (param ? ' : ' + param : ''));
  // Replace with your API call:
  // aFetch(API + '/api/command', {method:'POST', body: JSON.stringify({target, type, param})});
  document.getElementById('cmd-input').value = '';
}
